name: MCA Director Data Sync

on:
  schedule:
    - cron: "0 2 1 * *"   # Har mahine 1 tarikh ko raat 2 baje
  workflow_dispatch:        # Manual trigger bhi possible

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download MCA Director Master Data
        run: |
          mkdir -p data/mca
          echo "Downloading MCA Director Master Data..."

          # MCA data sets page se latest ZIP download
          # Try multiple known URLs
          urls=(
            "https://www.mca.gov.in/bin/dms/getdocument?mds=O0Nh6OF6tGkc7ug3N8YQqA%3D%3D&type=open"
            "https://www.mca.gov.in/content/dam/common/master-data/director_master_data.zip"
          )

          downloaded=false
          for url in "${urls[@]}"; do
            echo "Trying: $url"
            if wget -q --timeout=60 --tries=3 -O data/mca/director_master.zip "$url" 2>/dev/null; then
              # Check if valid ZIP (not HTML error page)
              if file data/mca/director_master.zip | grep -q "Zip"; then
                echo "Downloaded successfully"
                downloaded=true
                break
              fi
            fi
          done

          if [ "$downloaded" = false ]; then
            # Fallback: try scraping the MCA data page to find current URL
            pip install -q requests beautifulsoup4
            python3 - <<'PYEOF'
          import requests
          from bs4 import BeautifulSoup
          import re, os

          page = requests.get(
            "https://www.mca.gov.in/content/mca/global/en/data-and-reports/data-sets/company-master-data.html",
            timeout=30
          )
          soup = BeautifulSoup(page.text, "html.parser")
          links = soup.find_all("a", href=True)
          for link in links:
            href = link["href"]
            if "director" in href.lower() and (".zip" in href.lower() or "download" in href.lower()):
              print(f"Found: {href}")
              full_url = href if href.startswith("http") else "https://www.mca.gov.in" + href
              r = requests.get(full_url, timeout=120, stream=True)
              with open("data/mca/director_master.zip", "wb") as f:
                for chunk in r.iter_content(8192):
                  f.write(chunk)
              print("Downloaded via scrape")
              break
          PYEOF
          fi

      - name: Extract CSV
        run: |
          cd data/mca
          unzip -o director_master.zip || true
          ls -lh
          # Find the CSV file
          find . -name "*.csv" | head -5

      - name: Load to Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          CSV_FILE=$(find data/mca -name "*.csv" | head -1)
          if [ -z "$CSV_FILE" ]; then
            echo "No CSV found!"
            exit 1
          fi
          echo "Loading: $CSV_FILE"
          python -m scrapers.mca_parser --file "$CSV_FILE"

      - name: Report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PYEOF'
          import os, sys
          sys.path.insert(0, ".")
          from app.database import SessionLocal
          from app.models import Lead, SourceType
          db = SessionLocal()
          total = db.query(Lead).count()
          mca = db.query(Lead).filter(Lead.source == SourceType.MCA_DIRECTOR).count()
          print(f"Total leads in DB: {total:,}")
          print(f"MCA directors: {mca:,}")
          db.close()
          PYEOF
