name: Phone Enrichment — Auto

on:
  schedule:
    - cron: "0 4 * * 3"   # Har Wednesday raat 4 baje
  workflow_dispatch:
    inputs:
      limit:
        description: 'Kitne leads enrich karne hain'
        default: '200'
      state:
        description: 'State filter (optional)'
        default: ''

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enrich phone numbers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, sys
          sys.path.insert(0, ".")
          from app.database import SessionLocal
          from app.models import Lead
          from scrapers.phone_enricher import lookup_phone

          limit = int(os.environ.get("INPUT_LIMIT", "200"))
          state_filter = os.environ.get("INPUT_STATE", "").strip()

          db = SessionLocal()
          query = db.query(Lead).filter(Lead.phone_primary.is_(None))
          if state_filter:
            query = query.filter(Lead.state.ilike(f"%{state_filter}%"))
          leads = query.limit(limit).all()

          enriched = 0
          for lead in leads:
            phone = lookup_phone(
              name=lead.full_name,
              address=lead.address_line,
              company=lead.company_name
            )
            if phone:
              lead.phone_primary = phone
              lead.phone_verified = True
              enriched += 1

          db.commit()
          db.close()
          print(f"Processed: {len(leads)} | Enriched: {enriched}")
          PYEOF
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit || '200' }}
          INPUT_STATE: ${{ github.event.inputs.state || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
