services:
  - type: web
    name: lead-gen-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lead-gen-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: lead-gen-db
    databaseName: leadgen
    user: leadgen
    plan: free
